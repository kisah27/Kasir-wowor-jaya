        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getFirestore, initializeFirestore,
            persistentLocalCache, persistentSingleTabManager,
            doc, getDoc, setDoc, getDocs, collection, deleteDoc, updateDoc,
            query, orderBy, limit, writeBatch, increment, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDasfuiRfaLx3fUFSq3a8JdYDiSJCyEJuU",
          authDomain: "kasir-wowor-jaya.firebaseapp.com",
          projectId: "kasir-wowor-jaya",
          storageBucket: "kasir-wowor-jaya.firebasestorage.app",
          messagingSenderId: "237198342011",
          appId: "1:237198342011:web:01854a6ef76690811a2fde",
          measurementId: "G-CGLZP3S3RL"
        };

        const app = initializeApp(firebaseConfig);

        // ⚡ Cache persisten single-tab (lebih stabil) + long-polling otomatis
        // (tahan jaringan seluler/proxy yang memutus koneksi streaming)
        let db;
        try {
            db = initializeFirestore(app, {
                localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }),
                experimentalAutoDetectLongPolling: true
            });
        } catch (e) {
            db = getFirestore(app);
        }

        const auth = getAuth(app);

        window.db = db;
        window.fs = { doc, getDoc, setDoc, getDocs, collection, deleteDoc, updateDoc, query, orderBy, limit, writeBatch, increment, onSnapshot };

        const siap = () => window.dispatchEvent(new Event('firebase-ready'));
        signInAnonymously(auth).then(siap).catch(err => { console.error("Auth Error:", err); siap(); });
    </script>

    <script>
        // ================== KONFIGURASI ==================
        const ADMIN_PIN = '1234'; // ⚠️ GANTI PIN ADMIN INI!
        const TOKO = {
            nama: 'WOWOR-JAYA',
            alamat: 'Jl. Contoh No. 123',
            telp: '0812-xxxx-xxxx',
            footer: 'Terima kasih atas kunjungan Anda!'
        };

        let keranjang = [];
        let scannerKasir = null;
        let scannerAdmin = null;
        let editBarcode = null;
        let quickAddBarcode = null;
        let cacheBarang = [];
        let cacheTransaksi = [];
        let barangLoaded = false;
        let lastScan = { text: '', time: 0 };
        let audioCtx = null;
        const KEY_KERANJANG = 'woworjaya_keranjang_v2';
        const jeda = ms => new Promise(r => setTimeout(r, ms));

        // ================== PELINDUNG TULISAN (ANTI MACET) ==================
        // Maksimal 10 detik menunggu server. Setelah itu:
        // - UI langsung lanjut (tombol tidak macet lagi)
        // - Data TETAP AMAN di perangkat & tersinkron otomatis saat koneksi pulih
        const WAKTU_TULIS = 10000;
        function tulisDenganStatus(p, ms = WAKTU_TULIS) {
            return new Promise((resolve, reject) => {
                let selesai = false;
                const timer = setTimeout(() => {
                    if (selesai) return;
                    selesai = true;
                    p.then(() => console.log('[Sinkron] data tersinkron ke server (terlambat)'))
                     .catch(err => console.error('[Sinkron] tulisan tertunda GAGAL:', err));
                    resolve('menunggu');
                }, ms);
                p.then(() => {
                    if (!selesai) { selesai = true; clearTimeout(timer); resolve('tersinkron'); }
                }).catch(err => {
                    if (!selesai) { selesai = true; clearTimeout(timer); reject(err); }
                });
            });
        }

        // ================== UTILITAS ==================
        function formatRupiah(angka) {
            return 'Rp ' + (Number(angka) || 0).toLocaleString('id-ID');
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c =>
                ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        function formatTanggal(ms) {
            return new Date(ms).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function toast(msg, type = 'success') {
            const box = document.getElementById('toastBox');
            const el = document.createElement('div');
            const warna = type === 'error' ? 'bg-red-600' : type === 'warn' ? 'bg-amber-500' : 'bg-green-600';
            el.className = `${warna} text-white px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium text-center opacity-0 transition-opacity duration-300`;
            el.textContent = msg;
            box.appendChild(el);
            requestAnimationFrame(() => el.classList.remove('opacity-0'));
            setTimeout(() => {
                el.classList.add('opacity-0');
                setTimeout(() => el.remove(), 350);
            }, 3000);
        }

        function setStatusEl(id, pesan, tipe) {
            const el = document.getElementById(id);
            if (!pesan) { el.classList.add('hidden'); return; }
            const styles = {
                load: 'bg-blue-50 text-blue-700 border border-blue-200',
                ok: 'bg-green-50 text-green-700 border border-green-200',
                error: 'bg-red-50 text-red-700 border border-red-200'
            };
            el.className = 'mb-2 text-xs font-medium px-2.5 py-2 rounded-lg ' + (styles[tipe] || styles.load);
            el.textContent = pesan;
        }

        function beep(freq = 1100, durasi = 80, tipe = 'square', volume = 0.08) {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = tipe;
                osc.frequency.value = freq;
                gain.gain.value = volume;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + durasi / 1000);
            } catch (e) {}
        }

        function updateJam() {
            const now = new Date();
            const jam = now.toLocaleTimeString('id-ID', { hour12: false });
            const tgl = now.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            document.getElementById('jamDigital').textContent = `${tgl} • ${jam}`;
        }
        setInterval(updateJam, 1000);
        updateJam();

        // Indikator offline
        function perbaruiBadgeOffline() {
            const el = document.getElementById('badgeOffline');
            if (navigator.onLine) el.classList.add('hidden');
            else el.classList.remove('hidden');
        }
        window.addEventListener('online', () => { perbaruiBadgeOffline(); toast('Kembali online — sinkronisasi berjalan.', 'success'); });
        window.addEventListener('offline', perbaruiBadgeOffline);
        perbaruiBadgeOffline();

        // ================== SINKRONISASI REAL-TIME DAFTAR BARANG ==================
        function subscribeBarang() {
            if (subscribeBarang._started || !window.fs) return;
            subscribeBarang._started = true;
            window.fs.onSnapshot(
                window.fs.collection(window.db, 'barang'),
                snap => {
                    cacheBarang = [];
                    snap.forEach(d => cacheBarang.push({ id: d.id, ...d.data() }));
                    cacheBarang.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
                    barangLoaded = true;
                    const adminTerbuka = !document.getElementById('adminPanel').classList.contains('hidden');
                    const tabBarangAktif = !document.getElementById('tabBarang').classList.contains('hidden');
                    if (adminTerbuka && tabBarangAktif) renderListAdmin();
                },
                err => console.error('Snapshot barang error:', err)
            );
        }
        window.addEventListener('firebase-ready', subscribeBarang);
        if (window.fs) subscribeBarang();

        // ================== CARI NAMA PRODUK ONLINE ==================
        async function fetchJson(url, ms = 5000) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) return null;
                return await res.json();
            } catch (e) { return null; }
            finally { clearTimeout(t); }
        }

        function formatNamaProduk(p) {
            const nama = (p.product_name_id || p.product_name || '').trim();
            if (!nama) return null;
            const parts = [nama];
            const brand = (p.brands || '').split(',')[0].trim();
            if (brand && !nama.toLowerCase().includes(brand.toLowerCase())) parts.push(brand);
            const qty = (p.quantity || '').trim();
            if (qty && !nama.toLowerCase().includes(qty.toLowerCase())) parts.push(qty);
            return parts.join(' ');
        }

        function cariNamaProdukOnline(barcode) {
            const b = encodeURIComponent(String(barcode).trim());
            const urls = [
                `https://world.openfoodfacts.org/api/v2/product/${b}.json?fields=product_name,product_name_id,brands,quantity`,
                `https://world.openfoodfacts.org/api/v0/product/${b}.json`,
                `https://world.openproductsfacts.org/api/v2/product/${b}.json?fields=product_name,brands,quantity`,
                `https://world.openbeautyfacts.org/api/v2/product/${b}.json?fields=product_name,brands,quantity`
            ];
            return new Promise(resolve => {
                let sisa = urls.length, selesai = false, online = false;
                const cobaSelesai = () => {
                    if (!selesai && sisa === 0) { selesai = true; resolve({ nama: null, online }); }
                };
                urls.forEach(url => {
                    fetchJson(url).then(data => {
                        if (selesai) return;
                        if (data) online = true;
                        const nama = (data && data.status === 1 && data.product) ? formatNamaProduk(data.product) : null;
                        if (nama) { selesai = true; resolve({ nama, online: true }); }
                        else { sisa--; cobaSelesai(); }
                    }).catch(() => { if (!selesai) { sisa--; cobaSelesai(); } });
                });
            });
        }

        // ================== SCANNER KASIR ==================
        async function bukaScanner() {
            if (scannerKasir) return;
            document.getElementById('scannerContainer').classList.remove('hidden');
            scannerKasir = new Html5Qrcode('reader');
            try {
                await scannerKasir.start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 240, height: 140 } },
                    (decodedText) => {
                        prosesBarcode(decodedText);

        async function prosesBarcode(barcode) {
            if (!window.fs) return toast('Koneksi database belum siap, coba lagi.', 'warn');
            barcode = String(barcode).trim();
            if (!barcode) return;

            const now = Date.now();
            if (barcode === lastScan.text && now - lastScan.time < 1500) return;
            lastScan = { text: barcode, time: now };

            // 1) Cek cache lokal dulu → instan
            let data = cacheBarang.find(b => b.id === barcode);

            if (!data) {
                try {
                    const snap = await window.fs.getDoc(window.fs.doc(window.db, 'barang', barcode));
                    if (snap.exists()) data = { id: barcode, ...snap.data() };
                } catch (e) { /* offline & tidak di cache → lanjut tambah baru */ }
            }

            if (!data) {
                beep(220, 220, 'sawtooth');
                bukaQuickAdd(barcode);
                return;
            }

            const namaDb = (data.nama || '').trim();
            if (!namaDb || namaDb === barcode || /^\d+$/.test(namaDb)) {
                beep(220, 220, 'sawtooth');
                bukaQuickAdd(barcode, data);
                return;
            }

            const stok = (data.stok === undefined || data.stok === null) ? null : Number(data.stok);
            const existing = keranjang.find(it => it.barcode === barcode);

            if (stok !== null) {
                const diKeranjang = existing ? existing.qty : 0;
                if (stok <= diKeranjang) {
                    beep(220, 220, 'sawtooth');
                    toast(`Stok "${data.nama}" habis (max ${stok})!`, 'warn');
                    return;
                }
            }

            if (existing) existing.qty += 1;
            else keranjang.push({ barcode, nama: data.nama, harga: Number(data.harga) || 0, stok, qty: 1 });

            beep();
            tampilKeranjang();
            toast(`+1 ${data.nama}`);
        }

        function cariBarangManual() {

            const barcode = input.value.trim();

            }
        }

        function tampilKeranjang() {
            simpanKeranjang();
            const list = document.getElementById('keranjangList');
            list.innerHTML = '';

            const totalPcs = keranjang.reduce((a, i) => a + i.qty, 0);

            if (keranjang.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center mt-10">Keranjang kosong. Silakan scan barang.</p>';
                document.getElementById('totalHarga').innerText = formatRupiah(0);
                return;
            }

            keranjang.forEach((item, index) => {
                const subtotal = item.harga * item.qty;
                const stokBadge = item.stok !== null
                    ? `<span class="text-[10px] bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded ml-1">Stok: ${item.stok}</span>` : '';
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-white p-3 mb-2 rounded-lg shadow-sm border';
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <h3 class="font-semibold text-gray-800 text-sm truncate">${escapeHtml(item.nama)}${stokBadge}</h3>
                        <p class="text-xs text-gray-500">${formatRupiah(item.harga)} x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-1.5 ml-2">
                        <span class="font-bold text-gray-800 text-sm mr-1">${formatRupiah(subtotal)}</span>
                        <button onclick="kurangQty(${index})" class="bg-gray-200 w-7 h-7 rounded-full font-bold hover:bg-gray-300">-</button>
                        <button onclick="tambahQty(${index})" class="bg-gray-200 w-7 h-7 rounded-full font-bold hover:bg-gray-300">+</button>
                        <button onclick="hapusBarang(${index})" class="bg-red-100 text-red-600 w-7 h-7 rounded-full font-bold hover:bg-red-200">×</button>

        function tambahQty(i) {

        async function simpanQuickAdd() {
            const btn = document.getElementById('btnSimpanQA');
            if (btn.disabled) return;
            const barcode = quickAddBarcode;
            const nama = document.getElementById('qaNama').value.trim();
            const harga = parseInt((document.getElementById('qaHarga').value || '').replace(/\D/g, '')) || 0;
            const stokRaw = document.getElementById('qaStok').value.trim();
            const stok = stokRaw === '' ? null : Math.max(0, parseInt(stokRaw) || 0);

            if (!barcode) return;
            if (!nama) return toast('Nama barang wajib diisi!', 'error');
            if (harga <= 0) return toast('Isi harga jual barang!', 'error');

            btn.disabled = true;
            try {
                const status = await tulisDenganStatus(
                    window.fs.setDoc(window.fs.doc(window.db, 'barang', barcode), { nama, harga, stok })
                );

                // Update cache lokal agar scan berikutnya langsung dikenal
                const idx = cacheBarang.findIndex(b => b.id === barcode);
                if (idx >= 0) cacheBarang[idx] = { id: barcode, nama, harga, stok };
                else cacheBarang.push({ id: barcode, nama, harga, stok });
                cacheBarang.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));

                const existing = keranjang.find(it => it.barcode === barcode);
                if (existing) { existing.nama = nama; existing.harga = harga; existing.stok = stok; }
                else keranjang.push({ barcode, nama, harga, stok, qty: 1 });
                tampilKeranjang();
                tutupQuickAdd();
                beep();
                toast(status === 'tersinkron' ? `"${nama}" tersimpan & masuk keranjang!` : `"${nama}" masuk keranjang (sinkron server menunggu).`, status === 'tersinkron' ? 'success' : 'warn');
            } catch (e) {
                toast('Gagal simpan: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function tutupBayar() {

        function renderQuickBayar(total) {
            const opts = new Set([total]);
            [1000, 5000, 10000, 20000, 50000, 100000].forEach(n => { if (n > total) opts.add(n); });
            const bulat = Math.ceil(total / 5000) * 5000;
            if (bulat > total) opts.add(bulat);
            const sorted = [...opts].sort((a, b) => a - b).slice(0, 7);
            document.getElementById('quickBayar').innerHTML = sorted.map(n =>
                `<button onclick="setBayar(${n})" class="bg-gray-100 hover:bg-red-100 hover:text-red-600 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition">${n === total ? 'Uang Pas' : formatRupiah(n)}</button>`
            ).join('');
        }

        function updateKembalian() {
            const bayar = parseInt((document.getElementById('inputBayar').value || '').replace(/\D/g, '')) || 0;
            const total = hitungTotalKeranjang();
            const el = document.getElementById('kembalianDisplay');
            const btn = document.getElementById('btnKonfirmasiBayar');
            if (bayar >= total) {
                el.textContent = formatRupiah(bayar - total);
                el.className = 'text-2xl font-bold text-green-600';
                btn.disabled = false;
            } else {
                el.textContent = 'Kurang ' + formatRupiah(total - bayar);
                el.className = 'text-2xl font-bold text-red-600';
                btn.disabled = true;
            }
        }

        async function konfirmasiBayar() {
            const btn = document.getElementById('btnKonfirmasiBayar');
            if (btn.disabled) return;
            const total = hitungTotalKeranjang();
            const bayar = parseInt((document.getElementById('inputBayar').value || '').replace(/\D/g, '')) || 0;
            if (bayar < total) return toast('Uang bayar kurang!', 'error');

            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            const trx = {
                id: 'TRX' + Date.now(),
                waktu: Date.now(),
                items: keranjang.map(i => ({ barcode: i.barcode, nama: i.nama, harga: i.harga, qty: i.qty })),
                total, bayar, kembalian: bayar - total
            };
            const snapshotKeranjang = [...keranjang];

            try {
                // SEMUA penulisan dalam SATU batch = SATU perjalanan ke server
                const batch = window.fs.writeBatch(window.db);
                batch.set(window.fs.doc(window.db, 'transaksi', trx.id), trx);
                for (const it of snapshotKeranjang) {
                    if (it.stok !== null && it.stok !== undefined) {
                        batch.update(window.fs.doc(window.db, 'barang', it.barcode), {
                            stok: window.fs.increment(-it.qty)
                        });
                    }
                }
                const status = await tulisDenganStatus(batch.commit());

                keranjang = [];
                tampilKeranjang();
                tutupBayar();
                if (status === 'tersinkron') toast('Transaksi berhasil disimpan!');
                else toast('Transaksi tersimpan di perangkat — sinkron menunggu koneksi stabil.', 'warn');
                cetakStruk(trx);
            } catch (error) {
                toast('Gagal menyimpan transaksi: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '✓ Konfirmasi & Cetak Struk';
            }
        }

        async function lengkapiNamaOtomatis() {
            const targets = cacheBarang.filter(b => !b.nama || b.nama.trim() === '' || b.nama === b.id || /^\d+$/.test(b.nama));
            if (targets.length === 0) return toast('Semua barang sudah punya nama. 👍');
            if (!confirm(`Cari nama online untuk ${targets.length} barang yang belum bernama?\nProses butuh internet & beberapa saat.`)) return;
            let ok = 0, gagal = 0;
            for (let i = 0; i < targets.length; i++) {
                setStatusEl('statusNamaOtomatis', `🤖 Memproses ${i + 1} dari ${targets.length}...`, 'load');
                const b = targets[i];
                const res = await cariNamaProdukOnline(b.id);
                if (res.nama) {
                    try {
                        await tulisDenganStatus(
                            window.fs.setDoc(window.fs.doc(window.db, 'barang', b.id), { nama: res.nama }, { merge: true })
                        );
                        ok++;
                    } catch (e) { gagal++; }
                } else gagal++;
            }
            setStatusEl('statusNamaOtomatis', `Selesai: ${ok} nama terisi, ${gagal} tidak ditemukan/gagal.`, ok > 0 ? 'ok' : 'error');
        }

                <div class="flex justify-between items-center bg-white border rounded-lg p-2.5 mb-1.5">
                    <div class="min-w-0">
                        <div class="font-semibold text-sm text-gray-800 truncate">${escapeHtml(b.nama || b.id)}${badge}</div>
                        <div class="text-xs text-gray-400">${escapeHtml(b.id)} • Stok: ${stokTxt}</div>
                    </div>
                    <div class="flex items-center gap-1.5 ml-2">
                        <span class="font-bold text-sm">${formatRupiah(b.harga)}</span>
                        <button onclick="lookupNamaSatu(${i})" title="Cari nama otomatis" class="bg-indigo-100 text-indigo-600 w-7 h-7 rounded-full text-xs hover:bg-indigo-200">🔍</button>
                        <button onclick="isiFormEdit(${i})" title="Edit" class="bg-blue-100 text-blue-600 w-7 h-7 rounded-full text-xs hover:bg-blue-200">✏️</button>
                        <button onclick="hapusBarangDb(${i})" title="Hapus" class="bg-red-100 text-red-600 w-7 h-7 rounded-full text-xs hover:bg-red-200">🗑️</button>
                    </div>
                </div>`;
            }).join('');
        }

        function isiFormEdit(i) {
            const b = cacheBarang[i];
            editBarcode = b.id;
            const bc = document.getElementById('inputBarcode');
            bc.value = b.id;
            bc.readOnly = true;
            bc.classList.add('bg-gray-100');
            document.getElementById('inputNama').value = b.nama || '';
            document.getElementById('inputHarga').value = (b.harga || 0).toLocaleString('id-ID');
            document.getElementById('inputStok').value = (b.stok === null || b.stok === undefined) ? '' : b.stok;
            document.getElementById('btnSimpanBarang').textContent = 'UPDATE BARANG';
            document.getElementById('btnBatalEdit').classList.remove('hidden');
            setStatusEl('statusNamaOtomatis', null);
            document.getElementById('inputNama').focus();
        }

        function batalEdit() {
            editBarcode = null;
            const bc = document.getElementById('inputBarcode');
            bc.readOnly = false;
            bc.classList.remove('bg-gray-100');
            document.getElementById('btnSimpanBarang').textContent = 'SIMPAN BARANG';
            document.getElementById('btnBatalEdit').classList.add('hidden');
            setStatusEl('statusNamaOtomatis', null);
        }

        async function simpanBarang() {
            const btn = document.getElementById('btnSimpanBarang');
            if (btn.disabled) return; // cegah dobel klik / dobel Enter

            const bcInput = document.getElementById('inputBarcode');
            const barcode = bcInput.value.trim();
            const nama = document.getElementById('inputNama').value.trim();
            const harga = parseInt((document.getElementById('inputHarga').value || '').replace(/\D/g, '')) || 0;
            const stokRaw = document.getElementById('inputStok').value.trim();
            const stok = stokRaw === '' ? null : Math.max(0, parseInt(stokRaw) || 0);

            if (!barcode) return toast('Barcode wajib diisi!', 'error');
            if (!nama) return toast('Nama barang wajib diisi!', 'error');
            if (harga <= 0) return toast('Harga harus lebih dari 0!', 'error');

            const sedangEdit = !!editBarcode;
            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            const dataBaru = { nama, harga, stok };

            // ⚡ Update optimis: tampilkan langsung di daftar tanpa nunggu server
            const idx = cacheBarang.findIndex(b => b.id === barcode);
            if (idx >= 0) cacheBarang[idx] = { id: barcode, ...dataBaru };
            else cacheBarang.push({ id: barcode, ...dataBaru });
            cacheBarang.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));
            if (barangLoaded) renderListAdmin();

            try {
                // ⏱️ Maksimal 10 detik. Setelah itu dianggap "menunggu sinkron",
                // data tetap aman di perangkat & tersinkron otomatis nanti.
                const status = await tulisDenganStatus(
                    window.fs.setDoc(window.fs.doc(window.db, 'barang', barcode), dataBaru)
                );
                toast(
                    status === 'tersinkron'
                        ? (sedangEdit ? 'Barang berhasil diupdate!' : 'Barang baru berhasil disimpan!')
                        : 'Tersimpan di perangkat — sinkron ke server menunggu koneksi stabil.',
                    status === 'tersinkron' ? 'success' : 'warn'
                );
                bcInput.value = '';
                document.getElementById('inputNama').value = '';
                document.getElementById('inputHarga').value = '';
                document.getElementById('inputStok').value = '';
                batalEdit();
                setStatusEl('statusNamaOtomatis', null);
            } catch (error) {
                toast('Gagal simpan: ' + error.message, 'error');
                renderListAdmin(); // daftar dikoreksi dari server/cache
            } finally {
                btn.disabled = false;
                btn.textContent = 'SIMPAN BARANG';
            }
        }

        async function hapusBarangDb(i) {
            const b = cacheBarang[i];
            if (!confirm(`Hapus "${b.nama || b.id}" dari database?`)) return;
            try {
                const status = await tulisDenganStatus(
                    window.fs.deleteDoc(window.fs.doc(window.db, 'barang', b.id))
                );
                toast(status === 'tersinkron' ? 'Barang dihapus.' : 'Dihapus di perangkat (sinkron menunggu).', status === 'tersinkron' ? 'success' : 'warn');
            } catch (e) {
                toast('Gagal hapus: ' + e.message, 'error');
            }
        }

        async function loadTransaksi() {
            const div = document.getElementById('listTransaksi');
            div.innerHTML = '<p class="text-center text-gray-400 py-3">Memuat riwayat...</p>';
            try {
                const q = window.fs.query(
                    window.fs.collection(window.db, 'transaksi'),
                    window.fs.orderBy('waktu', 'desc'),
                    window.fs.limit(30)
                );
                const snap = await window.fs.getDocs(q);
                cacheTransaksi = [];
                snap.forEach(d => cacheTransaksi.push(d.data()));

                if (cacheTransaksi.length === 0) {
                    div.innerHTML = '<p class="text-center text-gray-400 py-3">Belum ada transaksi.</p>';
                    return;
                }

                div.innerHTML = cacheTransaksi.map((t, i) => {
                    const items = t.items || [];
                    return `
                    <details class="bg-white border rounded-lg mb-2 overflow-hidden">
                        <summary class="p-3 cursor-pointer flex justify-between items-center hover:bg-gray-50">
                            <div>
                                <div class="text-sm font-semibold text-gray-800">${formatTanggal(t.waktu)}</div>
                                <div class="text-xs text-gray-400">${escapeHtml(t.id)} • ${items.length} jenis barang</div>
                            </div>
                            <span class="font-bold text-red-600 text-sm">${formatRupiah(t.total)}</span>
                        </summary>
                        <div class="px-3 pb-3 border-t pt-2">
                            ${items.map(it => `
                                <div class="flex justify-between text-xs py-0.5">
                                    <span>${escapeHtml(it.nama)} × ${it.qty}</span>
                                    <span>${formatRupiah(it.harga * it.qty)}</span>
                                </div>`).join('')}
                            <div class="flex justify-between text-xs font-semibold border-t mt-1 pt-1"><span>Bayar</span><span>${formatRupiah(t.bayar)}</span></div>
                            <div class="flex justify-between text-xs font-semibold"><span>Kembali</span><span>${formatRupiah(t.kembalian)}</span></div>
                            <button onclick="cetakUlangStruk(${i})" class="mt-2 w-full bg-blue-500 text-white text-xs py-1.5 rounded-lg hover:bg-blue-600">🖨️ Cetak Ulang Struk</button>
                        </div>
                    </details>`;
                }).join('');
            } catch (e) {
                div.innerHTML = '<p class="text-center text-red-500 py-3">Gagal memuat: ' + escapeHtml(e.message) + '</p>';
            }
        }

        // ================== EVENT LISTENER ==================
        document.getElementById('manualBarcode').addEventListener('keydown', e => {
            if (e.key === 'Enter') cariBarangManual();
        });
        document.getElementById('inputBarcode').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); isiNamaOtomatis(e.target.value); }
        });
        document.getElementById('inputNama').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('inputHarga').focus();
        });
        document.getElementById('inputHarga').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('inputStok').focus();
        });
        document.getElementById('inputStok').addEventListener('keydown', e => {
            if (e.key === 'Enter') simpanBarang();
        });

        document.getElementById('inputHarga').addEventListener('input', function () {
            const v = this.value.replace(/\D/g, '');
            this.value = v ? Number(v).toLocaleString('id-ID') : '';
        });
        document.getElementById('inputBayar').addEventListener('input', function () {
            const v = this.value.replace(/\D/g, '');
            this.value = v ? Number(v).toLocaleString('id-ID') : '';
            updateKembalian();
        });
        document.getElementById('inputBayar').addEventListener('keydown', e => {
            if (e.key === 'Enter') konfirmasiBayar();
        });
        document.getElementById('qaHarga').addEventListener('input', function () {
            const v = this.value.replace(/\D/g, '');
            this.value = v ? Number(v).toLocaleString('id-ID') : '';
        });
        document.getElementById('qaNama').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('qaHarga').focus();
        });
        document.getElementById('qaHarga').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('qaStok').focus();
        });
        document.getElementById('qaStok').addEventListener('keydown', e => {
            if (e.key === 'Enter') simpanQuickAdd();
        });

        // ================== INISIALISASI ==================
        document.querySelector('header h1').textContent = TOKO.nama;
        muatKeranjang();
    </script>
</body>
</html>
